name: Habito
description: 'Habito is a UK-based digital mortgage broker that lets people research, compare, and apply
  for mortgages online across the whole of the market, pairing self-serve digital tools with human mortgage
  experts, alongside related home-buying services. Founded as a fintech in the consumer lending and real-estate
  space and backed by Ribbit Capital, Habito has since joined Monzo. The company operates a consumer web
  product (Webflow-hosted marketing site) and does not publish a public developer API program, developer
  portal, or OpenAPI at the time of this profile; this record is maintained by the API Evangelist network
  and reflects only publicly verifiable surfaces.'
